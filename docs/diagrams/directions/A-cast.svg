<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="ttl desc" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
 <title id="ttl">CRUCIBLE — the cast, and what each one is not allowed to see</title>
 <desc id="desc">A dark-ground poster of the CRUCIBLE hardening loop, drawn as a cast of characters in three regions. Region A, at the left, is the agent under test: a card for TARGET_AGENT on gemini-3.5-flash-lite, above a panel listing its eight tools grouped under the six capability classes they carry - CAP_MOVES_MONEY, CAP_MUTATES_DURABLE_STATE, CAP_READS_PII, CAP_EXTERNAL_COMMS, CAP_ESCALATES_PRIVILEGE and CAP_INVOKES_AGENT. Region B, at the right, is the cast: six numbered cards read left to right and top to bottom in the order of one round - RED_STRATEGIST, CRUCIBLE_PLUGIN with POLICY_ENGINE, TRIPWIRE, CORONER, ARMORER, and REGRESSION_WARDEN with PROMOTION_GATE. Each card gives the component's role in plain English, what it does, and what it is deliberately blind to. A filled marker means that blindness is enforced in Cloud IAM; a hollow marker means it is held by convention plus a code check. An arrow runs from RED_STRATEGIST into the target, hand-off arrows run between the cards, and a dashed return rail runs from the promotion gate back to the attacker for the next round. Region C, a band across the foot, is the sealed held-out attack family: F4, destination smuggling, twenty-four attacks written by hand and locked in a Cloud Storage bucket that the patch-writing identity holds no read permission on. Nine components are named in total: four contain a language model - TARGET_AGENT, RED_STRATEGIST, CORONER and ARMORER - and five are pure code - CRUCIBLE_PLUGIN, POLICY_ENGINE, TRIPWIRE, REGRESSION_WARDEN and PROMOTION_GATE. No rate, percentage or measured result appears anywhere on the plate.</desc>
 <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 Z" fill="#7C736B"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 Z" fill="#6E665E"/></marker>
  <marker id="arrow-brass" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 Z" fill="#E8933A"/></marker>
 </defs>
 <rect x="0" y="0" width="1920" height="1080" fill="#14110F"/>
  <text x="56" y="46" font-size="24" fill="#E8933A" font-weight="600" letter-spacing="0.26em">CRUCIBLE</text>
  <text x="56" y="96" font-size="40" fill="#EDE8E2" font-weight="600">The cast, and what each one is not allowed to see</text>
  <text x="56" y="132" font-size="24" fill="#9A938B">A pre-deployment hardening harness for an AI agent that holds real permissions.</text>
  <rect x="1236" y="27" width="21" height="21" fill="#2A1A0F" stroke="#E8933A" stroke-width="2"/>
  <text x="1272" y="44" font-size="24" fill="#9A938B">[M]  contains a language model</text>
  <rect x="1236" y="59" width="21" height="21" fill="#1E1A17" stroke="#7FA0B0" stroke-width="2"/>
  <text x="1272" y="76" font-size="24" fill="#9A938B">[C]  pure code, no model on the path</text>
  <circle cx="1246" cy="101" r="7" fill="#C9564E"/>
  <text x="1272" y="108" font-size="24" fill="#9A938B">a boundary enforced in Cloud IAM</text>
  <circle cx="1246" cy="133" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="1272" y="140" font-size="24" fill="#9A938B">a boundary held by convention plus a code check</text>
  <line x1="56" y1="154" x2="1864" y2="154" stroke="#2E2A26" stroke-width="1"/>
  <text x="56" y="186" font-size="24" fill="#7C736B" font-weight="600" letter-spacing="0.14em">A · THE AGENT UNDER TEST</text>
  <text x="692" y="186" font-size="24" fill="#7C736B" font-weight="600">B · THE CAST — one round, in order. Each one is blind to something on purpose.</text>
  <rect x="56" y="200" width="596" height="142" fill="#2A1A0F" stroke="#E8933A" stroke-width="1.6"/>
  <rect x="56" y="200" width="4" height="142" fill="#E8933A"/>
  <text x="78" y="238" font-size="24" fill="#EDE8E2" font-weight="600">TARGET_AGENT</text>
  <text x="616.0" y="238" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace" text-anchor="end">gemini-3.5-flash-lite</text>
  <text x="78" y="270" font-size="24" fill="#9A938B">The agent on trial. A refund agent with real</text>
  <text x="78" y="296" font-size="24" fill="#9A938B">authority: it moves money in a real ledger.</text>
  <text x="78" y="322" font-size="24" fill="#9A938B">Hash-locked before the run, tool bodies too.</text>
  <rect x="56" y="354" width="596" height="448" fill="#191512" stroke="#3A342E" stroke-width="1.4"/>
  <text x="78" y="392" font-size="24" fill="#EDE8E2" font-weight="600" letter-spacing="0.02em">EIGHT TOOLS AND WHAT THEY CAN DO</text>
  <text x="78" y="430" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_MOVES_MONEY</text>
  <text x="308.0" y="430" font-size="24" fill="#6E665E">moves value out</text>
  <text x="94" y="456" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">issue_refund · issue_store_credit</text>
  <text x="78" y="487" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_MUTATES_DURABLE_STATE</text>
  <text x="452.0" y="487" font-size="24" fill="#6E665E">writes state</text>
  <text x="94" y="513" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">issue_refund · issue_store_credit</text>
  <text x="94" y="539" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">update_case_notes · escalate_to_human</text>
  <text x="94" y="565" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">delegate_to_specialist</text>
  <text x="78" y="596" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_READS_PII</text>
  <text x="279.2" y="596" font-size="24" fill="#6E665E">reads personal data</text>
  <text x="94" y="622" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">lookup_order · lookup_customer</text>
  <text x="94" y="648" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">email_customer</text>
  <text x="78" y="679" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_EXTERNAL_COMMS · email_customer</text>
  <text x="78" y="710" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_ESCALATES_PRIVILEGE</text>
  <text x="423.2" y="710" font-size="24" fill="#6E665E">calls a human</text>
  <text x="94" y="736" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">escalate_to_human</text>
  <text x="78" y="767" font-size="24" fill="#EDE8E2" font-weight="500" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">CAP_INVOKES_AGENT</text>
  <text x="336.79999999999995" y="767" font-size="24" fill="#6E665E">calls another agent</text>
  <text x="94" y="793" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">delegate_to_specialist</text>
  <rect x="692" y="200" width="572" height="190" fill="#2A1A0F" stroke="#E8933A" stroke-width="1.6"/>
  <rect x="692" y="200" width="4" height="190" fill="#E8933A"/>
  <circle cx="728" cy="230" r="14" fill="none" stroke="#E8933A" stroke-width="1.8"/>
  <text x="728" y="238" font-size="24" fill="#E8933A" font-weight="600" text-anchor="middle">1</text>
  <text x="750" y="238" font-size="24" fill="#EDE8E2" font-weight="600">RED_STRATEGIST</text>
  <text x="1228.0" y="238" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace" text-anchor="end">gemini-3.6-flash</text>
  <text x="714" y="270" font-size="24" fill="#9A938B">The attacker. Six attacks a round, picked</text>
  <text x="714" y="296" font-size="24" fill="#9A938B">by seeded code from a hand-written corpus;</text>
  <text x="714" y="322" font-size="24" fill="#9A938B">the model only varies the wording.</text>
  <circle cx="721" cy="340" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="740" y="348" font-size="24" fill="#9A938B">Never sees the policy, its rules, or the</text>
  <text x="740" y="374" font-size="24" fill="#9A938B">clauses that decide what a breach is.</text>
  <rect x="1292" y="200" width="572" height="190" fill="#1E1A17" stroke="#7FA0B0" stroke-width="1.6"/>
  <rect x="1292" y="200" width="4" height="190" fill="#7FA0B0"/>
  <circle cx="1328" cy="230" r="14" fill="none" stroke="#7FA0B0" stroke-width="1.8"/>
  <text x="1328" y="238" font-size="24" fill="#7FA0B0" font-weight="600" text-anchor="middle">2</text>
  <text x="1350" y="238" font-size="24" fill="#EDE8E2" font-weight="600">CRUCIBLE_PLUGIN</text>
  <text x="1828.0" y="238" font-size="24" fill="#9A938B" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" text-anchor="end">pure code</text>
  <text x="1314" y="270" font-size="24" fill="#9A938B">and POLICY_ENGINE: the gate between the</text>
  <text x="1314" y="296" font-size="24" fill="#9A938B">agent and its tools. Every call gets one</text>
  <text x="1314" y="322" font-size="24" fill="#9A938B">of ALLOW, DENY, APPROVAL_REQUIRED.</text>
  <text x="1314" y="348" font-size="24" fill="#9A938B">A blocked call's tool body never runs.</text>
  <circle cx="1321" cy="366" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="1340" y="374" font-size="24" fill="#9A938B">Blind to the attack. It never scores.</text>
  <rect x="692" y="406" width="572" height="190" fill="#1E1A17" stroke="#7FA0B0" stroke-width="1.6"/>
  <rect x="692" y="406" width="4" height="190" fill="#7FA0B0"/>
  <circle cx="728" cy="436" r="14" fill="none" stroke="#7FA0B0" stroke-width="1.8"/>
  <text x="728" y="444" font-size="24" fill="#7FA0B0" font-weight="600" text-anchor="middle">3</text>
  <text x="750" y="444" font-size="24" fill="#EDE8E2" font-weight="600">TRIPWIRE</text>
  <text x="1228.0" y="444" font-size="24" fill="#9A938B" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" text-anchor="end">pure code</text>
  <text x="714" y="476" font-size="24" fill="#9A938B">The witness. Rules breach or no breach from</text>
  <text x="714" y="502" font-size="24" fill="#9A938B">the calls that actually happened, not from</text>
  <text x="714" y="528" font-size="24" fill="#9A938B">anything the agent said, against eleven</text>
  <text x="714" y="554" font-size="24" fill="#9A938B">human-written clauses.</text>
  <circle cx="721" cy="572" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="740" y="580" font-size="24" fill="#9A938B">Blind to the payload, family and policy.</text>
  <rect x="1292" y="406" width="572" height="190" fill="#2A1A0F" stroke="#E8933A" stroke-width="1.6"/>
  <rect x="1292" y="406" width="4" height="190" fill="#E8933A"/>
  <circle cx="1328" cy="436" r="14" fill="none" stroke="#E8933A" stroke-width="1.8"/>
  <text x="1328" y="444" font-size="24" fill="#E8933A" font-weight="600" text-anchor="middle">4</text>
  <text x="1350" y="444" font-size="24" fill="#EDE8E2" font-weight="600">CORONER</text>
  <text x="1828.0" y="444" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace" text-anchor="end">gemini-3.5-flash-lite</text>
  <text x="1314" y="476" font-size="24" fill="#9A938B">The pathologist. Writes the autopsy of one</text>
  <text x="1314" y="502" font-size="24" fill="#9A938B">breach: what was called, in what order, and</text>
  <text x="1314" y="528" font-size="24" fill="#9A938B">where. It cannot propose a fix.</text>
  <circle cx="1321" cy="546" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="1340" y="554" font-size="24" fill="#9A938B">No fix field exists in its output schema.</text>
  <circle cx="1321" cy="572" r="7" fill="#C9564E"/>
  <text x="1340" y="580" font-size="24" fill="#9A938B">Its account cannot write policy. IAM.</text>
  <rect x="692" y="612" width="572" height="190" fill="#2A1A0F" stroke="#E8933A" stroke-width="1.6"/>
  <rect x="692" y="612" width="4" height="190" fill="#E8933A"/>
  <circle cx="728" cy="642" r="14" fill="none" stroke="#E8933A" stroke-width="1.8"/>
  <text x="728" y="650" font-size="24" fill="#E8933A" font-weight="600" text-anchor="middle">5</text>
  <text x="750" y="650" font-size="24" fill="#EDE8E2" font-weight="600">ARMORER</text>
  <text x="1228.0" y="650" font-size="24" fill="#9A938B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace" text-anchor="end">gemini-3.7-flash</text>
  <text x="714" y="682" font-size="24" fill="#9A938B">The smith. Writes the patch in three verbs:</text>
  <text x="714" y="708" font-size="24" fill="#9A938B">deny, constrain_arg, require_approval.</text>
  <text x="714" y="734" font-size="24" fill="#9A938B">There is no allow verb, so no patch can</text>
  <text x="714" y="760" font-size="24" fill="#9A938B">widen what the agent is permitted to do.</text>
  <circle cx="721" cy="778" r="6.4" fill="none" stroke="#9A938B" stroke-width="2.2"/>
  <text x="740" y="786" font-size="24" fill="#9A938B">Blind to the attacker's own words.</text>
  <rect x="1292" y="612" width="572" height="190" fill="#1E1A17" stroke="#7FA0B0" stroke-width="1.6"/>
  <rect x="1292" y="612" width="4" height="190" fill="#7FA0B0"/>
  <circle cx="1328" cy="642" r="14" fill="none" stroke="#7FA0B0" stroke-width="1.8"/>
  <text x="1328" y="650" font-size="24" fill="#7FA0B0" font-weight="600" text-anchor="middle">6</text>
  <text x="1350" y="650" font-size="24" fill="#EDE8E2" font-weight="600">REGRESSION_WARDEN</text>
  <text x="1828.0" y="650" font-size="24" fill="#9A938B" font-family="'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" text-anchor="end">pure code</text>
  <text x="1314" y="682" font-size="24" fill="#9A938B">and PROMOTION_GATE. Ruler and clerk.</text>
  <text x="1314" y="708" font-size="24" fill="#9A938B">The Warden replays 26 benign fixtures</text>
  <text x="1314" y="734" font-size="24" fill="#9A938B">and 9 known-bads against the new rule.</text>
  <text x="1314" y="760" font-size="24" fill="#9A938B">The Gate writes the rule, reads the bytes</text>
  <text x="1314" y="786" font-size="24" fill="#9A938B">back off disk, and promotes or rolls back.</text>
  <path d="M690,250 H658" fill="none" stroke="#E8933A" stroke-width="2.4" marker-end="url(#arrow-brass)"/>
  <path d="M1266,300 H1288" fill="none" stroke="#7C736B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1266,506 H1288" fill="none" stroke="#7C736B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1266,712 H1288" fill="none" stroke="#7C736B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1578,802 V816 H674 V376 H688" fill="none" stroke="#6E665E" stroke-width="1.6" stroke-dasharray="11 7" marker-end="url(#arrow-muted)"/>
  <rect x="768.5799999999999" y="801" width="722.84" height="30" fill="#14110F"/>
  <text x="1130" y="823" font-size="24" fill="#6E665E" text-anchor="middle">promoted, or rolled back — and the next round starts here</text>
  <rect x="56" y="838" width="1808" height="186" fill="#1C1512" stroke="#C9564E" stroke-width="1.8"/>
  <rect x="56" y="838" width="5" height="186" fill="#C9564E"/>
  <path d="M92,860 v-12 a13,13 0 0 1 26,0 v12" fill="none" stroke="#C9564E" stroke-width="3.4" stroke-linecap="square"/>
  <rect x="85" y="860" width="40" height="28" fill="none" stroke="#C9564E" stroke-width="3.4" rx="3"/>
  <text x="164" y="878" font-size="26" fill="#EDE8E2" font-weight="600">C · THE SEALED SET — F4, destination smuggling: 24 attacks, sealed before the first patch existed.</text>
  <text x="82" y="916" font-size="24" fill="#9A938B">The 24 live in a Cloud Storage bucket,</text>
  <text x="82" y="942" font-size="24" fill="#9A938B">never committed here. Fingerprint first:</text>
  <text x="82" y="968" font-size="24" fill="#7C736B" font-family="'IBM Plex Mono',ui-monospace,Consolas,'DejaVu Sans Mono',Menlo,monospace">docs/proof/sealed-family-commitment.json</text>
  <circle cx="683" cy="908" r="7" fill="#C9564E"/>
  <text x="702" y="916" font-size="24" fill="#9A938B">The identity that writes the patches</text>
  <text x="702" y="942" font-size="24" fill="#9A938B">holds no read permission on that bucket.</text>
  <text x="702" y="968" font-size="24" fill="#9A938B">Cloud IAM, not a prompt, not a promise.</text>
  <text x="1270" y="916" font-size="24" fill="#9A938B">It aims at capability classes no rule was</text>
  <text x="1270" y="942" font-size="24" fill="#9A938B">trained on. The question is not whether a</text>
  <text x="1270" y="968" font-size="24" fill="#9A938B">fix worked where it was written.</text>
  <line x1="82" y1="976" x2="1838" y2="976" stroke="#3A342E" stroke-width="1"/>
  <text x="82" y="1002" font-size="24" fill="#6E665E">UNCLASSIFIED is a sentinel, not a seventh class.</text>
  <text x="1838" y="1002" font-size="24" fill="#6E665E" text-anchor="end">One of the 24 was named in a public commit on 2026-08-21, and deliberately not replaced.</text>
</svg>
