<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRUCIBLE - the hardening loop - beat N4</title>
<!--
  loop-player.html - the 45 second architecture beat, N4 of the demo video.

  Cued by docs/diagrams/loop-cues.json. Specified by
  docs/design/architecture-animation-spec.md, whose three rules are the whole
  brief and whose fourth section says everything else is decoration:

    1  SPOTLIGHT, NEVER BUILD-ON. The full topology is on screen at frame one.
       A build-on withholds the architecture for 45 seconds and delivers it at
       the end, which is backwards for a judge scoring whether it is legible.
    2  BLINDNESS IS THE MOVE NOBODY ELSE HAS. When a component lights, the
       things it cannot see go visibly dark in the same beat.
    3  THE TRUST BOUNDARY RESOLVES LAST. The line is drawn the whole time. On
       the closing sentence the model-bearing side desaturates and the
       deterministic side keeps its colour.

  SELF-CONTAINED ON PURPOSE. No CDN, no fetch, no font request. A file:// page
  cannot fetch, and a capture run that needs a web server is a capture run that
  fails at 2am. The cost is that the SVG and the cue JSON are inlined copies,
  and a copy is a second source of truth, so scripts/check-loop-cues.py diffs
  both against their files (R6) instead of trusting them.

  DETERMINISTIC BY SEEK. Everything drawn is a pure function of one integer t.
  window.__cuePlayer.seek(ms) suppresses transitions, renders, and settles in
  the same frame, so a headless driver gets the same pixels for the same t
  every time. play() is the real-time path for recording a take.

  window.__cuePlayer = {
      play(), pause(), toggle(),
      seek(ms),          deterministic, transitions off, returns the clamped t
      advance(dt_ms),    deterministic step
      state(),           READ BACK OFF THE DOM, not off intent
      frameAt(ms),       the pure frame plan, no DOM read, no side effect
      duration_ms, cues, targets
  }

  state() deliberately reads the classes it finds on the elements rather than
  echoing the cue it meant to apply. An assertion against a value the renderer
  never touched is a check that passes while measuring nothing, which is this
  project's signature defect and stands at twelve recorded instances.

  Chrome (scrub bar, cue list, keys) is HIDDEN unless the page is opened with
  ?chrome=1, so the recorded frame carries nothing that is not the diagram.
-->
<style>
:root {
  color-scheme: dark;

  /* Straight off docs/diagrams/loop.svg. Colour carries semantics and only
     semantics: molten = contains a model = untrusted, steel = pure code =
     deterministic, quench = a refusal or rejection path. Nothing here is
     picked for contrast or variety. */
  --page:        #0A0908;
  --ground:      #14110F;
  --panel:       #1E1A17;
  --panel-model: #2A1A0F;
  --molten:      #E8933A;
  --molten-lit:  #F5B461;
  --steel:       #7FA0B0;
  --quench:      #C23B44;
  --quench-bg:   #1C0F10;
  --ink:         #EDE8E2;
  --ink-2:       #9A938B;
  --ink-3:       #6E665E;
  --rule:        #2E2A26;

  --dim-opacity:   .20;
  --blind-opacity: .09;

  --fit: 1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--page);
  color: var(--ink);
  font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

/* The stage is authored at exactly 1920x1080 and scaled to fit. Every overlay
   coordinate is therefore an SVG user unit, which is what getBBox returns, so
   chips need no unit conversion and cannot drift as the window resizes. */
#fit {
  position: absolute; inset: 0; overflow: hidden;
}
#stage {
  /* Centred by translate rather than by a flex or grid parent. The stage is
     laid out at its full 1920x1080 whatever the scale is, so a centring parent
     centres the UNSCALED box and the plate ends up clipped. */
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--fit));
  background: var(--ground);
  box-shadow: 0 0 0 1px #241F1B, 0 40px 120px -40px #000;
}
#diagram { position: absolute; inset: 0; }
#diagram svg { display: block; width: 1920px; height: 1080px; }
#overlay {
  position: absolute; inset: 0;
  pointer-events: none;
}

/* ---------------------------------------------------------------------------
   Rule 1. The spotlight is subtractive: the named component keeps the state it
   already had and everything else falls away. Nothing is ever built up.
   --------------------------------------------------------------------------- */
#diagram .node, #diagram .edge { opacity: 1; }

#diagram .node.is-dim,
#diagram .edge.is-dim   { opacity: var(--dim-opacity); }
#diagram .node.is-blind { opacity: var(--blind-opacity); }
#diagram .edge.is-blind { opacity: var(--blind-opacity); }

#diagram .node.is-lit .shape,
#diagram .node.is-lit .shape-lip { stroke-width: 3.4; }
#diagram .node.is-lit           { filter: drop-shadow(0 0 26px rgba(232,147,58,.30)); }
#diagram .node.code.is-lit,
#diagram .node.store.is-lit,
#diagram .node.decision.is-lit,
#diagram .node.term.is-lit      { filter: drop-shadow(0 0 26px rgba(127,160,176,.34)); }

#edge-labels { transition: opacity .28s ease; }
#stage.spotlighting #edge-labels { opacity: .26; }

/* ---------------------------------------------------------------------------
   Rule 3. Fires once, last. Above the trust boundary in the narration is
   ABOVE it in this plate - loop.svg draws the boundary horizontally, with the
   four model-bearing components above and the thirteen pure-code components
   below. The set is read off the class attribute (.node.model), never listed
   here, so adding a model-bearing component cannot leave this out of date.
   --------------------------------------------------------------------------- */
#stage.resolved #diagram .node.model,
#stage.resolved #diagram #zone-model {
  filter: grayscale(1) brightness(.62) contrast(.9);
}
#stage.resolved #diagram .node   { opacity: 1; }
#stage.resolved #diagram .edge   { opacity: .34; }
#stage.resolved #diagram #void-note line { stroke: var(--steel); }
#stage.resolved #diagram #void-note text { fill: var(--ink); }
#diagram #void-note { transition: opacity .5s ease; }

/* The wipe that resolves the line. Pure function of elapsed cue time; there is
   no CSS animation here because a CSS animation restarts on seek and would
   make the same t render two different frames. */
#boundary-wipe {
  position: absolute; left: 28px; top: 416px; height: 5px; width: 0;
  background: linear-gradient(90deg, rgba(232,147,58,0) 0%, var(--molten) 22%, var(--steel) 100%);
  opacity: 0;
}
#boundary-head {
  position: absolute; top: 408px; width: 2px; height: 21px;
  background: var(--ink); opacity: 0;
}

/* ---------------------------------------------------------------------------
   Rule 2. A blindness target is a thing the lit component cannot see. Some of
   them are elements of the diagram; the sealed held-out family and the fixture
   suites are not, and cannot be, because they are what the diagram is blind to.
   So each one is drawn as a chip pinned to the element it belongs to, which is
   what `anchor` in the cue file is for and what R1 checks.

   A chip arrives LIT and then quenches. That ordering is the point: the claim
   is not "this is absent", it is "this exists and is being withheld".
   --------------------------------------------------------------------------- */
/* The opaque plate lives on the OUTER element and the fade is applied to the
   inner one. Fading the whole chip would let the dimmed diagram read through
   the quenched text, and a blindness claim rendered as legible-but-crossed
   over a legible node is worse than no claim at all. */
.chip { position: absolute; background: var(--quench-bg); }
.chip-lead {
  position: absolute; width: 1px; background: var(--quench); opacity: .55;
}
.chip-box {
  border: 1.5px solid var(--quench);
  padding: 8px 14px 9px;
  white-space: nowrap;
}
.chip-eyebrow {
  font-size: 16px; font-weight: 600; letter-spacing: .16em;
  color: var(--quench); text-transform: uppercase; margin-bottom: 3px;
}
.chip-label {
  position: relative; display: inline-block;
  font-size: 19px; font-weight: 600; color: var(--ink);
}
.chip-strike {
  position: absolute; left: -2px; top: 52%; height: 2px;
  background: var(--quench); width: 0;
}
.chip-enf {
  font-size: 16px; font-weight: 500; letter-spacing: .1em;
  color: var(--ink-3); text-transform: uppercase; margin-top: 4px;
}

/* ---------------------------------------------------------------------------
   Operator chrome. Hidden unless ?chrome=1. Nothing below this comment appears
   in a recorded frame.
   --------------------------------------------------------------------------- */
#chrome-bar { display: none; }
html[data-chrome="1"] #chrome-bar {
  display: flex; align-items: center; gap: 18px;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 12px 18px; background: #100E0C; border-top: 1px solid var(--rule);
  font-size: 13px; color: var(--ink-2);
}
#chrome-bar button {
  font: inherit; color: var(--ink); background: #1E1A17;
  border: 1px solid #3A342E; padding: 5px 14px; cursor: pointer;
}
#chrome-bar input[type=range] { flex: 1; }
#chrome-note { color: var(--ink-3); max-width: 46ch; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
#chrome-t { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
            color: var(--molten); min-width: 8ch; }

/* seek() sets this for one frame so the render settles instantly. Without it a
   seek lands mid-transition and the same t yields different pixels. */
.no-anim, .no-anim * {
  transition: none !important;
  animation: none !important;
}
</style>
</head>
