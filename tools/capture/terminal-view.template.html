<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>CRUCIBLE - Google Cloud proof</title>
<!--
  THE N6a BEAT, RENDERED FROM A REAL TRANSCRIPT. Generated by
  tools/capture/build-terminal-view.py. Do not hand-edit; rebuild it.

  WHAT THIS IS AND IS NOT, BECAUSE THE DISTINCTION IS THE WHOLE POINT.

  Every character below is OUTPUT THAT WAS ACTUALLY PRODUCED, captured by
  running `tools/capture/gcp-proof.ps1` and keeping what came back. Nothing is
  composed, edited, prettified or shortened. The capture timestamp is on
  screen, and so is the command that produced it, so a judge can re-run it.

  It is a RENDERING of that transcript, not a screen recording of a terminal.
  Those are different things and the footer says which one this is. A screen
  recording is strictly better as proof and the shot list still says to shoot
  it live; this exists so the beat is never blocked on finding ninety free
  minutes with a screen recorder.

  DETERMINISTIC BY SEEK - window.__termPlayer.seek(ms), the same contract
  loop-player.html, the run view and the agent view all use.
-->
<style>
  :root{
    --ground:#14110F; --panel:#1A1512; --line:#2A2521;
    --ink:#EDE8E2; --muted:#9A938B; --dim:#7C736B;
    --model:#E8933A; --code:#7FA0B0; --ok:#8FBF7F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);
       font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
       -webkit-font-smoothing:antialiased}

  header{padding:26px 64px 18px;border-bottom:1px solid var(--line);
         display:flex;justify-content:space-between;align-items:baseline}
  header .t{font-size:26px;color:var(--model);letter-spacing:.05em;
            font-weight:600}
  header .s{font-size:20px;color:var(--dim)}

  main{height:892px;padding:24px 64px 0;overflow:hidden;
       display:flex;flex-direction:column;justify-content:flex-end}
  .ln{font-size:23px;line-height:1.42;white-space:pre-wrap;word-break:break-all;
      color:var(--muted)}
  .ln.hide{display:none}
  .ln.cmd{color:var(--ink)}
  .ln.cmd .p{color:var(--model)}
  .ln.hdr{color:var(--dim)}
  .ln.blank{height:.5em}
  .ln.note{color:var(--model)}
  .ln em{font-style:normal;color:var(--ok)}
  .ln b{font-weight:600;color:var(--ink)}

  footer{position:absolute;left:0;right:0;bottom:0;height:82px;padding:0 64px;
         background:var(--ground);border-top:1px solid var(--line);
         display:flex;align-items:center;gap:26px;font-size:18px;
         color:var(--dim)}
  footer b{color:var(--muted);font-weight:400}
</style></head>
<body>

<header>
  <div class="t">CRUCIBLE &mdash; is this actually running on Google Cloud?</div>
  <div class="s" id="stamp"></div>
</header>

<main id="term"></main>
<footer id="foot"></footer>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

$("stamp").textContent = "captured " + DATA.captured_at;

// HIGHLIGHTS ARE STRUCTURAL, NOT EDITORIAL. Only these exact substrings get
// colour, and only where they already appear - nothing is inserted, removed or
// reworded. Marking `http_status` green does not change what it says.
const HOT = [
  "crucible-target@crucible-hack-2026.iam.gserviceaccount.com",
  "aiplatform.googleapis.com",
  "crucible-sealed-x7",
  "google/gemma-4-26b-a4b-it-maas",
  '"http_status": 200',
  "crucible-00004-gfk",
];
function mark(text){
  let out = esc(text);
  for (const h of HOT) {
    const e = esc(h);
    if (out.includes(e)) out = out.split(e).join("<em>" + e + "</em>");
  }
  return out;
}

$("term").innerHTML = DATA.lines.map((l,i) => {
  if (l.kind === "blank") return `<div class="ln blank hide" data-i="${i}"></div>`;
  if (l.kind === "cmd") {
    return `<div class="ln cmd hide" data-i="${i}"><span class="p">PS&gt;</span> `
         + mark(l.text.replace(/^PS>\s*/, "")) + `</div>`;
  }
  return `<div class="ln ${l.kind} hide" data-i="${i}">${mark(l.text)}</div>`;
}).join("");

// SAYS WHAT IT IS. Real output, rendered - not a screen recording.
$("foot").innerHTML =
  `<b>real output, rendered from a captured transcript &mdash; not a screen recording.</b>`
  + `<span>${esc(DATA.command)}</span>`;

// A command line lands whole; output lands a line at a time, faster.
const CMD_MS = 900, OUT_MS = 210;
let acc = 0;
const at = DATA.lines.map(l => {
  acc += (l.kind === "cmd" ? CMD_MS : OUT_MS);
  return acc;
});
const DURATION = acc + 2200;

function render(t){
  let n = 0;
  while (n < at.length && at[n] <= t) n++;
  document.querySelectorAll("#term .ln").forEach(el =>
    el.classList.toggle("hide", Number(el.dataset.i) >= n));
  return t;
}
window.__termPlayer = {
  duration_ms: DURATION,
  seek(ms){ return render(Math.max(0, Math.min(DURATION, ms|0))); },
  state(){ return {
    lines_visible: document.querySelectorAll("#term .ln:not(.hide)").length,
    total: DATA.lines.length,
  };},
};
render(0);
</script>
</body></html>
