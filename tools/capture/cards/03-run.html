<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>CRUCIBLE - run view</title>
<!--
  THE RUN VIEW. Generated by tools/capture/build-run-view.py from a REAL bundle.
  Do not hand-edit the DATA block below; rebuild it.

  DETERMINISTIC BY SEEK, the same contract loop-player.html uses:

      window.__runPlayer = { seek(ms), duration_ms, state() }

  Everything drawn is a pure function of one integer t, so a headless driver
  gets the same pixels for the same t on every run. That is what makes the
  captured footage reproducible rather than a recording of one lucky evening.

  IT REPLAYS; IT DOES NOT SIMULATE. Every row on screen is a field from the
  bundle. The stream reveals episodes in their recorded order at a fixed
  cadence - the cadence is presentation, the rows are evidence. Nothing is
  invented, nothing is rounded, and the generator refuses to build if a field
  it needs is missing.
-->
<style>
  :root{
    --ground:#14110F; --panel:#1E1A17; --line:#2A2521;
    --ink:#EDE8E2; --muted:#9A938B; --dim:#7C736B;
    --model:#E8933A; --code:#7FA0B0; --refuse:#C23B44; --ok:#7FA0B0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);
       font-family:"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}

  header{padding:34px 60px 22px;border-bottom:1px solid var(--line)}
  .top{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
  h1 span{color:var(--model)}
  .runid{font-size:21px;color:var(--dim);
         font-family:ui-monospace,Consolas,monospace}
  .gcp{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap}
  .pill{font-family:ui-monospace,Consolas,monospace;font-size:19px;
        border:1px solid var(--line);border-radius:3px;padding:7px 13px;
        color:var(--muted);background:var(--panel)}
  .pill b{color:var(--ink);font-weight:600}
  .pill.live{border-color:var(--model);color:var(--model)}
  .pill.live b{color:var(--model)}

  main{display:grid;grid-template-columns:1000px 1fr;gap:0;height:728px}
  section{padding:26px 40px 0 60px;overflow:hidden}
  aside{padding:26px 60px 0 40px;border-left:1px solid var(--line);
        overflow:hidden}
  h2{font-family:ui-monospace,Consolas,monospace;font-size:18px;
     letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
     margin-bottom:16px}

  table{width:100%;border-collapse:collapse;
        font-family:ui-monospace,Consolas,monospace;font-size:20px}
  td{padding:6.5px 10px 6.5px 0;color:var(--muted);
     border-bottom:1px solid #221E1B;white-space:nowrap}
  tr.hide{visibility:hidden}
  td.r{color:var(--dim);width:70px}
  td.a{color:var(--ink);width:290px;overflow:hidden;text-overflow:ellipsis}
  td.v{width:190px;font-weight:600}
  td.pv{color:var(--dim);text-align:right}
  .BREACH{color:var(--refuse)}
  .CLEAN{color:var(--ok)}
  .FAULT{color:var(--dim)}

  .gate{border:1px solid var(--line);background:var(--panel);
        border-radius:4px;padding:18px 22px;margin-bottom:14px;
        font-family:ui-monospace,Consolas,monospace;font-size:19px;
        color:var(--muted)}
  .gate.hide{visibility:hidden}
  .gate .d{font-size:23px;font-weight:700;letter-spacing:.04em}
  .gate .d.PROMOTE{color:var(--model)}
  .gate .d.ROLLBACK,.gate .d.REJECT{color:var(--refuse)}
  .gate .row{display:flex;justify-content:space-between;margin-top:9px}
  .gate .row b{color:var(--ink);font-weight:600}

  .rule{margin-top:18px;border-left:3px solid var(--model);
        padding:12px 0 12px 16px;font-family:ui-monospace,Consolas,monospace;
        font-size:17px;color:var(--muted);line-height:1.5;
        white-space:pre-wrap;word-break:break-word}
  .rule.hide{visibility:hidden}

  footer{position:absolute;left:0;right:0;bottom:0;height:104px;
         padding:0 60px;background:var(--ground);
         border-top:1px solid var(--line);display:flex;align-items:center;
         gap:24px;font-family:ui-monospace,Consolas,monospace;font-size:16px;
         color:var(--dim);flex-wrap:wrap;overflow:hidden}
  footer b{color:var(--muted);font-weight:400}
</style></head>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// ---- static chrome, drawn once ------------------------------------------
$("runid").textContent = DATA.run_id;

const live = DATA.mode === "live";
const pills = [

  `<div class="pill">region <b>${esc(DATA.region)}</b></div>`,
];
if (DATA.revision) {
  pills.push(`<div class="pill">Cloud&nbsp;Run <b>${esc(DATA.revision)}</b></div>`);
}
for (const m of DATA.models) {
  pills.push(`<div class="pill">${esc(m.role)} <b>${esc(m.model_id)}</b>
    &middot; ${esc(m.provider)}/${esc(m.endpoint)}</div>`);
}
$("gcp").innerHTML = pills.join("");

$("locks").innerHTML =
  `<b>${DATA.stream.length} episodes in this run &middot; ${esc(DATA.bundle)}</b>` +
  "<b>hash locks, frozen before it:</b>" +
  DATA.locks.map(l =>
    `<span>${esc(l.name)} <b>${esc(String(l.value).slice(0,10))}</b></span>`
  ).join("");

// The stream is capped to what fits; the footer count keeps the total honest.
const ROWS = 19;   // what fits above the footer at 1080p
const shown = DATA.stream.slice(0, ROWS);
$("stream").innerHTML = shown.map((e,i) => {
  const cls = e.fault ? "FAULT" : (e.breach ? "BREACH" : "CLEAN");
  const label = e.fault ? "TARGET_FAULT" : (e.breach ? "BREACH" : "CLEAN");
  return `<tr class="hide" data-i="${i}">
    <td class="r">r${esc(e.round)}</td>
    <td class="a">${esc(e.attack)}</td>
    <td class="v ${cls}">${label}</td>
    <td class="pv">policy v${esc(e.pv)}</td></tr>`;
}).join("");

$("gates").innerHTML = DATA.gates.map((g,i) =>
  `<div class="gate hide" data-i="${i}">
     <div class="d ${esc(g.decision)}">${esc(g.decision)} &middot; round ${esc(g.round)}</div>
     <div class="row"><span>benign floor</span><b>${esc(g.benign)}</b></div>
     <div class="row"><span>newly blocked / newly breached</span>
          <b>${esc(g.b)} / ${esc(g.c)}</b></div>
     <div class="row"><span>G4 attack reduction</span><b>${esc(g.mode)}</b></div>
   </div>`).join("");

$("rule").textContent = DATA.sample_rule +
  "\n\n" + DATA.rules + " rules at policy " + DATA.policy_hash;

// ---- the deterministic player -------------------------------------------
// Episodes reveal at a fixed cadence, then each gate decision, then the rule.
// The cadence is presentation. The rows are evidence.
const EP_MS = 300, GATE_AT = shown.length * EP_MS + 400, GATE_MS = 900;
const DURATION = GATE_AT + DATA.gates.length * GATE_MS + 1600;

function render(t) {
  const nEp = Math.max(0, Math.min(shown.length, Math.floor(t / EP_MS)));
  document.querySelectorAll("#stream tr").forEach(tr => {
    tr.classList.toggle("hide", Number(tr.dataset.i) >= nEp);
  });
  const nG = t < GATE_AT ? 0
           : Math.min(DATA.gates.length, Math.floor((t - GATE_AT) / GATE_MS) + 1);
  document.querySelectorAll("#gates .gate").forEach(el => {
    el.classList.toggle("hide", Number(el.dataset.i) >= nG);
  });
  $("rule").classList.toggle("hide", nG < DATA.gates.length);
  return t;
}

window.__runPlayer = {
  duration_ms: DURATION,
  seek(ms) { return render(Math.max(0, Math.min(DURATION, ms | 0))); },
  // READ BACK OFF THE DOM, not off intent. An assertion against a value the
  // renderer never touched is a check that passes while measuring nothing.
  state() {
    return {
      episodes_visible: document.querySelectorAll("#stream tr:not(.hide)").length,
      gates_visible: document.querySelectorAll("#gates .gate:not(.hide)").length,
      rule_visible: !$("rule").classList.contains("hide"),
    };
  },
};
render(0);
